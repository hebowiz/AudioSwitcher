[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-switcher"
version = "0.1.1"
description = "Per-application audio output switcher for Windows 11"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "comtypes>=1.4,<2",
    "psutil>=5.9,<8",
    "winappaudiorouter==1.1.1",
]

[project.gui-scripts]
audio-switcher = "audio_switcher.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
